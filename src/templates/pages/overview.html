{% extends "base.html" %}
{% block title %}{{ _('overview.title') }} - Team Register{% endblock %}
{% block nav_overview %}bg-gray-800 text-white{% endblock %}
{% block page_title %}{{ _('overview.title') }}{% endblock %}

{% block content %}
<div x-data="overviewData()" x-init="fetchStats()">
    <!-- Stats Cards -->
    <div class="grid grid-cols-2 md:grid-cols-5 gap-4 mb-8">
        <div class="bg-white rounded-lg shadow-sm border p-4">
            <p class="text-xs text-gray-500 uppercase tracking-wide" x-text="i18n('overview.total')"></p>
            <p class="text-2xl font-bold mt-1" x-text="stats.total">-</p>
        </div>
        <div class="bg-white rounded-lg shadow-sm border p-4">
            <p class="text-xs text-gray-500 uppercase tracking-wide" x-text="i18n('overview.running')"></p>
            <p class="text-2xl font-bold mt-1 text-blue-600" x-text="stats.by_status?.running ?? 0">-</p>
        </div>
        <div class="bg-white rounded-lg shadow-sm border p-4">
            <p class="text-xs text-gray-500 uppercase tracking-wide" x-text="i18n('overview.success')"></p>
            <p class="text-2xl font-bold mt-1 text-green-600" x-text="stats.by_status?.success ?? 0">-</p>
        </div>
        <div class="bg-white rounded-lg shadow-sm border p-4">
            <p class="text-xs text-gray-500 uppercase tracking-wide" x-text="i18n('overview.failed')"></p>
            <p class="text-2xl font-bold mt-1 text-red-600" x-text="stats.by_status?.failed ?? 0">-</p>
        </div>
        <div class="bg-white rounded-lg shadow-sm border p-4">
            <p class="text-xs text-gray-500 uppercase tracking-wide" x-text="i18n('overview.success_rate')"></p>
            <p class="text-2xl font-bold mt-1" x-text="stats.success_rate || '0%'">-</p>
        </div>
    </div>

    <!-- Quick Actions -->
    <div class="bg-white rounded-lg shadow-sm border p-6 mb-8">
        <h3 class="text-sm font-semibold text-gray-700 mb-4" x-text="i18n('overview.quick_actions')"></h3>
        <div class="flex flex-wrap gap-3">
            <a href="/tasks/create" class="px-4 py-2 bg-blue-600 text-white text-sm rounded-lg hover:bg-blue-700 transition"
               x-text="'+ ' + i18n('overview.new_task')"></a>
            <a href="/api/export/csv" class="px-4 py-2 bg-gray-100 text-gray-700 text-sm rounded-lg hover:bg-gray-200 transition"
               x-text="i18n('overview.export_csv')"></a>
            <button @click="fetchStats()" class="px-4 py-2 bg-gray-100 text-gray-700 text-sm rounded-lg hover:bg-gray-200 transition"
                    x-text="i18n('overview.refresh')"></button>
        </div>
    </div>

    <!-- Recent Tasks -->
    <div class="bg-white rounded-lg shadow-sm border">
        <div class="px-6 py-4 border-b flex items-center justify-between">
            <h3 class="text-sm font-semibold text-gray-700" x-text="i18n('overview.recent_tasks')"></h3>
            <a href="/tasks" class="text-xs text-blue-600 hover:underline" x-text="i18n('overview.view_all') + ' →'"></a>
        </div>
        <div class="overflow-x-auto">
            <table class="w-full text-sm">
                <thead class="bg-gray-50 text-xs text-gray-500 uppercase">
                    <tr>
                        <th class="px-6 py-3 text-left" x-text="i18n('overview.table.email')"></th>
                        <th class="px-6 py-3 text-left" x-text="i18n('overview.table.status')"></th>
                        <th class="px-6 py-3 text-left" x-text="i18n('overview.table.phase')"></th>
                        <th class="px-6 py-3 text-left" x-text="i18n('overview.table.created')"></th>
                    </tr>
                </thead>
                <tbody class="divide-y">
                    <template x-for="task in recentTasks" :key="task.id">
                        <tr class="hover:bg-gray-50 cursor-pointer" @click="window.location='/tasks/' + task.id">
                            <td class="px-6 py-3 font-mono text-xs" x-text="task.email"></td>
                            <td class="px-6 py-3">
                                <span class="px-2 py-0.5 rounded-full text-xs font-medium"
                                      :class="{
                                          'bg-green-100 text-green-700': task.status === 'success',
                                          'bg-red-100 text-red-700': task.status === 'failed',
                                          'bg-blue-100 text-blue-700': task.status === 'running',
                                          'bg-yellow-100 text-yellow-700': task.status === 'pending',
                                          'bg-gray-100 text-gray-700': task.status === 'cancelled'
                                      }"
                                      x-text="translateEnum('status', task.status, task.status)"></span>
                            </td>
                            <td class="px-6 py-3 text-gray-500" x-text="translateEnum('phase', task.phase, task.phase)"></td>
                            <td class="px-6 py-3 text-gray-400 text-xs" x-text="new Date(task.created_at).toLocaleString(window._locale)"></td>
                        </tr>
                    </template>
                    <tr x-show="recentTasks.length === 0">
                        <td colspan="4" class="px-6 py-8 text-center text-gray-400" x-text="i18n('overview.no_tasks')"></td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>
</div>

<script>
function overviewData() {
    return {
        stats: {},
        recentTasks: [],
        async fetchStats() {
            const [statsRes, tasksRes] = await Promise.all([
                fetch('/api/stats').then(r => r.json()),
                fetch('/api/tasks?limit=10').then(r => r.json())
            ]);
            this.stats = statsRes;
            this.recentTasks = tasksRes.items || [];
        }
    }
}
</script>
{% endblock %}
