{% extends "base.html" %}
{% block title %}{{ _('tasks.create.title') }} - Team Register{% endblock %}
{% block nav_tasks %}bg-gray-800 text-white{% endblock %}
{% block page_title %}{{ _('tasks.create.title') }}{% endblock %}

{% block content %}
<div x-data="createTaskData()" x-init="init()">
    <div class="max-w-xl mx-auto">
        <div class="bg-white rounded-lg shadow-sm border p-6">
            <h3 class="text-sm font-semibold text-gray-700 mb-4" x-text="i18n('tasks.create.create_registration_task')"></h3>
            <form @submit.prevent="submit()">
                <div class="space-y-4">
                    <div>
                        <label class="block text-xs font-medium text-gray-600 mb-1" x-text="i18n('tasks.create.email') + ' *'"></label>
                        <input type="email" x-model="form.email" required
                               class="w-full text-sm border rounded-md px-3 py-2 focus:ring-2 focus:ring-blue-500 focus:border-blue-500"
                               :placeholder="i18n('tasks.create.placeholders.email')">
                    </div>
                    <div>
                        <label class="block text-xs font-medium text-gray-600 mb-1" x-text="i18n('tasks.create.password') + ' *'"></label>
                        <input type="text" x-model="form.password" required
                               class="w-full text-sm border rounded-md px-3 py-2 focus:ring-2 focus:ring-blue-500 focus:border-blue-500"
                               :placeholder="i18n('tasks.create.placeholders.password')">
                    </div>
                    <div>
                        <label class="block text-xs font-medium text-gray-600 mb-1" x-text="i18n('tasks.create.profile_id') + ' *'"></label>
                        <input type="text" x-model="form.profile_id" required
                               class="w-full text-sm border rounded-md px-3 py-2 focus:ring-2 focus:ring-blue-500 focus:border-blue-500"
                               :placeholder="i18n('tasks.create.placeholders.profile_id')">
                    </div>
                    <div>
                        <label class="block text-xs font-medium text-gray-600 mb-1" x-text="i18n('tasks.create.card_key')"></label>
                        <input type="text" x-model="form.card_key"
                               class="w-full text-sm border rounded-md px-3 py-2 focus:ring-2 focus:ring-blue-500 focus:border-blue-500"
                               :placeholder="i18n('tasks.create.placeholders.card_key')">
                        <p class="text-xs text-gray-400 mt-1" x-text="i18n('tasks.create.card_key_hint')"></p>
                    </div>
                    <div>
                        <label class="block text-xs font-medium text-gray-600 mb-1">浏览器 Provider *</label>
                        <select x-model="form.browser_provider" class="w-full text-sm border rounded-md px-3 py-2">
                            <template x-for="option in browserProviders" :key="option.provider_name">
                                <option :value="option.provider_name" x-text="option.provider_name"></option>
                            </template>
                        </select>
                    </div>
                    <div>
                        <label class="block text-xs font-medium text-gray-600 mb-1">卡 Provider *</label>
                        <select x-model="form.card_provider" class="w-full text-sm border rounded-md px-3 py-2">
                            <template x-for="option in cardProviders" :key="option.provider_name">
                                <option :value="option.provider_name" x-text="option.provider_name"></option>
                            </template>
                        </select>
                    </div>
                    <div>
                        <label class="block text-xs font-medium text-gray-600 mb-1">邮件 Provider *</label>
                        <select x-model="form.mail_provider" @change="handleMailProviderChange()" class="w-full text-sm border rounded-md px-3 py-2">
                            <template x-for="option in mailProviders" :key="option.provider_name">
                                <option :value="option.provider_name" x-text="option.provider_name"></option>
                            </template>
                        </select>
                    </div>
                    <div x-show="selectedMailProviderNeedsAccount()" x-cloak>
                        <label class="block text-xs font-medium text-gray-600 mb-1">邮件账号 *</label>
                        <select x-model="form.mail_account_id" class="w-full text-sm border rounded-md px-3 py-2">
                            <option value="">未选择（走全局 fallback）</option>
                            <template x-for="account in filteredMailAccounts()" :key="account.id">
                                <option :value="account.id" x-text="`${account.label} (${account.email})`"></option>
                            </template>
                        </select>
                        <p class="text-xs text-gray-400 mt-1">优先使用所选账号；不选时回退到全局默认账号或 legacy 环境变量。</p>
                    </div>
                </div>
                <div class="flex items-center justify-between mt-6 pt-4 border-t">
                    <a href="/tasks" class="text-sm text-gray-500 hover:text-gray-700" x-text="i18n('common.cancel')"></a>
                    <button type="submit" :disabled="submitting"
                            class="px-4 py-2 bg-blue-600 text-white text-sm rounded-md hover:bg-blue-700 disabled:opacity-50">
                        <span x-show="!submitting" x-text="i18n('tasks.create.create_btn')"></span>
                        <span x-show="submitting" x-text="i18n('tasks.create.creating')"></span>
                    </button>
                </div>
            </form>
        </div>

        <!-- Batch Mode -->
        <div class="bg-white rounded-lg shadow-sm border p-6 mt-6">
            <h3 class="text-sm font-semibold text-gray-700 mb-2" x-text="i18n('tasks.create.batch_title')"></h3>
            <p class="text-xs text-gray-400 mb-3" x-text="i18n('tasks.create.batch_hint')"></p>
            <textarea x-model="batchText" rows="5"
                      class="w-full text-xs font-mono border rounded-md px-3 py-2 focus:ring-2 focus:ring-blue-500"
                      :placeholder="i18n('tasks.create.placeholders.batch')"></textarea>
            <div class="flex justify-end mt-3">
                <button @click="batchSubmit()" :disabled="!batchText.trim() || submitting"
                        class="px-4 py-2 bg-gray-800 text-white text-sm rounded-md hover:bg-gray-900 disabled:opacity-50"
                        x-text="i18n('tasks.create.batch_btn')"></button>
            </div>
        </div>
    </div>
</div>

<script>
function createTaskData() {
    return {
        form: {
            email: '',
            password: '',
            profile_id: '',
            card_key: '',
            browser_provider: '',
            card_provider: '',
            mail_provider: '',
            mail_account_id: '',
        },
        batchText: '',
        submitting: false,
        browserProviders: [],
        cardProviders: [],
        mailProviders: [],
        mailAccounts: [],
        defaults: {},

        async init() {
            await this.fetchSelections();
        },

        async fetchSelections() {
            const [config, browserProviders, cardProviders, mailProviders, mailAccounts] = await Promise.all([
                fetchJson('/api/config'),
                fetchJson('/api/providers?provider_type=browser&active_only=true'),
                fetchJson('/api/providers?provider_type=card&active_only=true'),
                fetchJson('/api/providers?provider_type=mail&active_only=true'),
                fetchJson('/api/mail-accounts?active_only=true'),
            ]);
            this.defaults = config || {};
            this.browserProviders = browserProviders || [];
            this.cardProviders = cardProviders || [];
            this.mailProviders = mailProviders || [];
            this.mailAccounts = mailAccounts || [];
            this.form.browser_provider = this.defaults.default_browser_provider || this.browserProviders[0]?.provider_name || '';
            this.form.card_provider = this.defaults.default_card_provider || this.cardProviders[0]?.provider_name || '';
            this.form.mail_provider = this.defaults.default_mail_provider || this.mailProviders[0]?.provider_name || '';
            this.form.mail_account_id = this.defaults.default_mail_account_id || '';
        },

        selectedMailProviderConfig() {
            return this.mailProviders.find(p => p.provider_name === this.form.mail_provider) || null;
        },

        selectedMailProviderNeedsAccount() {
            const provider = this.selectedMailProviderConfig();
            const sessionMode = String(provider?.config?.session_mode || 'managed').toLowerCase();
            return sessionMode === 'credentialed';
        },

        filteredMailAccounts() {
            const provider = this.selectedMailProviderConfig();
            const upstream = String(provider?.config?.provider_name || '').toLowerCase();
            if (!upstream) return this.mailAccounts;
            return this.mailAccounts.filter(account => String(account.provider_name || '').toLowerCase() === upstream);
        },

        handleMailProviderChange() {
            this.form.mail_account_id = '';
        },

        async submit() {
            this.submitting = true;
            try {
                const data = await fetchJson('/api/tasks', {
                    method: 'POST', headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(this.form)
                });
                window.location.href = '/tasks/' + data.id;
            } catch (error) {
                showToast(error.message || i18n('tasks.create.create_failed'), 'error');
            } finally { this.submitting = false; }
        },

        async batchSubmit() {
            const lines = this.batchText.trim().split('\n').filter(l => l.trim());
            if (!lines.length) return;
            this.submitting = true;
            let ok = 0, fail = 0;
            for (const line of lines) {
                const [email, password, profile_id, card_key, browser_provider, card_provider, mail_provider, mail_account_id] = line.split(',').map(s => s.trim());
                if (!email || !password || !profile_id) { fail++; continue; }
                try {
                    const payload = {
                        email,
                        password,
                        profile_id,
                        card_key: card_key || '',
                        browser_provider: browser_provider || this.form.browser_provider || '',
                        card_provider: card_provider || this.form.card_provider || '',
                        mail_provider: mail_provider || this.form.mail_provider || '',
                        mail_account_id: mail_account_id || this.form.mail_account_id || '',
                    };
                    await fetchJson('/api/tasks', {
                        method: 'POST', headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify(payload)
                    });
                    ok++;
                } catch { fail++; }
            }
            this.submitting = false;
            showToast(i18n('tasks.create.batch_result', { ok, fail }), ok > 0 ? 'success' : 'error');
            if (ok > 0) setTimeout(() => window.location.href = '/tasks', 1000);
        }
    }
}
</script>
{% endblock %}
